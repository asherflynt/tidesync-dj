name: TideSync DJ
version: "2.1.0"
slug: tidesync_dj
description: A DJ for your Music Assistant library that sequences sets by measured tempo, key and energy
url: https://github.com/asherflynt/tidesync-dj/tree/main/tidesync_dj
arch:
  - amd64
  - aarch64
init: false
ingress: true
ingress_port: 8099
panel_icon: mdi:disc-player
panel_title: TideSync DJ
# Only the Core REST API is needed (states + events). We deliberately do NOT
# request hassio_api / host access — least privilege.
homeassistant_api: true
options:
  ma_host: "homeassistant.local"
  ma_port: 8095
  ma_token: ""
  ma_username: ""
  ma_password: ""
  anthropic_api_key: ""
  claude_model: "claude-opus-5-5"
  dj_tick_interval: 30
  vibe_input_text_entity: ""
  ha_action_entity: ""
  keep_analysis_running: false
schema:
  ma_host: str
  ma_port: int
  ma_token: password?
  ma_username: str?
  ma_password: password?
  # Optional. Without a key the DJ reads vibes with keyword rules; with one,
  # Claude turns the vibe into sound descriptions for the library search.
  anthropic_api_key: password?
  claude_model: list(claude-opus-5-5|claude-sonnet-5-5|claude-haiku-5-5|claude-sonnet-4-6|claude-opus-4-8|claude-haiku-4-5)
  dj_tick_interval: int
  vibe_input_text_entity: str?
  ha_action_entity: str?
  # Restart Music Assistant's nightly analysis scan whenever it stops with tracks
  # still pending, so a large library is analysed around the clock. Needs an admin token.
  keep_analysis_running: bool?
  # No longer used (kept so options saved by 1.x still validate on upgrade).
  playlist_provider: str?
  tidal_provider: str?
  weather_entity: str?
  temperature_entity: str?
  sonic_features: bool?
  getsongbpm_api_key: str?
  harmonic_sort: bool?
  candidate_grounding: bool?
