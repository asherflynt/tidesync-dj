configuration:
  ma_host:
    name: Music Assistant host
    description: >-
      Hostname or IP where Music Assistant is reachable. If it runs as an add-on
      on this machine, "homeassistant.local" usually works.
  ma_port:
    name: Music Assistant port
    description: The Music Assistant port (default 8095).
  ma_token:
    name: Music Assistant token
    description: >-
      A long-lived token from Music Assistant (Settings → your profile). Use an
      admin user's token if you turn on "Keep analysis running".
  ma_username:
    name: Music Assistant username
    description: Alternative to a token. Ignored when a token is set.
  ma_password:
    name: Music Assistant password
    description: Password for the user above.
  anthropic_api_key:
    name: Anthropic API key (optional)
    description: >-
      Optional. Without a key the DJ reads your vibe with built-in keyword rules.
      With one, Claude turns the vibe into descriptions of sound for the library
      search. Only the vibe text, time of day and listener name are sent.
  claude_model:
    name: Claude model
    description: Used only when an API key is set. The request is small, so cost is low on any model.
  dj_tick_interval:
    name: Queue check interval (seconds)
    description: How often the DJ checks whether the queue needs topping up.
  vibe_input_text_entity:
    name: Vibe helper entity (optional)
    description: >-
      An input_text helper to follow. When its value changes, the DJ switches to
      that vibe.
  ha_action_entity:
    name: Action helper entity (optional)
    description: >-
      An input_text or input_select helper that drives the DJ: play, stop, skip,
      previous, nudge, energy up, energy down, "vibe: …" or "player: …".
  keep_analysis_running:
    name: Keep analysis running
    description: >-
      Music Assistant analyses local files for a few hours each night. Turn this
      on to restart that scan whenever it stops with tracks left, so a large
      library is analysed around the clock. Uses more CPU. Needs an admin token.
  styles_url:
    name: Style tagger address (optional)
    description: >-
      Where the optional style tagger runs, for example http://192.168.1.138:8791.
      It measures each song's music style from the audio, so mixes stay in their
      genre and can reach songs Music Assistant has not analysed yet. Leave blank
      if you don't run it.
  playlist_provider:
    name: (no longer used)
  tidal_provider:
    name: (no longer used)
  weather_entity:
    name: (no longer used)
  temperature_entity:
    name: (no longer used)
  sonic_features:
    name: (no longer used)
  getsongbpm_api_key:
    name: (no longer used)
  harmonic_sort:
    name: (no longer used)
  candidate_grounding:
    name: (no longer used)
